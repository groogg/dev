name: linux

on: [push, pull_request]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # Skips the interactive and machine-wide steps (_configure, _shell).
      # The recipes fail on any error; the second run checks they can be rerun.
      - run: just _linux-deps _dot _ssh-config
      - run: just _linux-deps _dot _ssh-config
