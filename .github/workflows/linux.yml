name: linux

on: [push, pull_request]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Skips the interactive and machine-wide steps (_configure, _shell).
      # The recipes fail on any error; the second run checks they can be rerun.
      - run: just _linux-deps _dot _ssh-config
      - run: just _linux-deps _dot _ssh-config
